<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="31" fill="#000000" />
  
  <!-- Outer glowing gold ring -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="#F5C518" stroke-width="2.5" />
  
  <!-- Intertwined rings -->
  <circle cx="28" cy="28" r="14" fill="none" stroke="#F5C518" stroke-width="2" opacity="0.9" />
  <circle cx="36" cy="32" r="14" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.9" />
  
  <!-- SAIS lettering -->
  <text x="32" y="37" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="16" fill="#F5C518" text-anchor="middle" letter-spacing="0.5">SAIS</text>
  
  <!-- Labs lettering -->
  <text x="32" y="47" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="7.5" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">Labs</text>
</svg>
